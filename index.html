const artistOrder=["ときのそら","ロボ子さん","星街すいせい","さくらみこ","AZKi","hololive 1st Generation","夜空メル","アキ・ローゼンタール","白上フブキ","夏色まつり","赤井はあと","湊あくあ","紫咲シオン","百鬼あやめ","癒月ちょこ","大空スバル","hololive GAMERS","大神ミオ","猫又おかゆ","戌神ころね","ホロライブファンタジー","兎田ぺこら","潤羽るしあ","不知火フレア","白銀ノエル","宝鐘マリン","hololive 4th Generation","天音かなた","桐生ココ","角巻わため","常闇トワ","姫森ルーナ","ねぽらぼ","雪花ラミィ","桃鈴ねね","獅白ぼたん","尾丸ポルカ","holox","ラプラス・ダークネス","鷹嶺ルイ","博衣こより","沙花叉クロヱ","風間いろは","ReGLOSS","火威青","音乃瀬奏","一条莉々華","儒烏風亭らでん","轟はじめ","FLOW GLOW","響咲リオナ","虎金妃笑虎","水宮枢","輪堂千速","綺々羅々ヴィヴィ","GawrGura"];
const unitMembers=new Set(unitOrder);

const genres=[...new Set(uniqueSongs.map(x=>x[0]))].sort((a,b)=>a.localeCompare(b,'ja'));
const g=document.querySelector('#g'),q=document.querySelector('#q'),list=document.querySelector('#list');
genres.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;g.appendChild(o)});

function makeSongList(titles){
 const ul=document.createElement('ul');
 titles.sort((a,b)=>a.localeCompare(b,'ja')).forEach(t=>{
   const li=document.createElement('li');li.textContent=t;ul.appendChild(li);
 });
 return ul;
}

function makeArtistDetails(name,titles){
 const ad=document.createElement('details');
 ad.className='artist';
 ad.open=false;
 const as=document.createElement('summary');
 as.textContent=`${name} (${titles.length}曲)`;
 ad.appendChild(as);
 ad.appendChild(makeSongList(titles));
 return ad;
}

function makeUnitMemberDetails(name,titles){
 const ad=document.createElement('details');
 ad.className='unit-member';
 ad.open=false;
 const as=document.createElement('summary');
 as.textContent=`${name} (${titles.length}曲)`;
 ad.appendChild(as);
 ad.appendChild(makeSongList(titles));
 return ad;
}

function render(){
 const query=q.value.trim().toLowerCase(),genre=g.value;
 const filtered=uniqueSongs.filter(([gg,group,a,t])=>
   (!genre||gg===genre)&&(!query||`${gg} ${group} ${a} ${t}`.toLowerCase().includes(query)));

 const groups={};
 filtered.forEach(([gg,group,a,t])=>{
   groups[gg]??={};
   groups[gg][group]??={};
   groups[gg][group][a]??=[];
   groups[gg][group][a].push(t);
 });

 list.innerHTML='';

 Object.keys(groups).sort((a,b)=>a.localeCompare(b,'ja')).forEach(gg=>{
   const gd=document.createElement('details');
   gd.open=false;
   const gs=document.createElement('summary');
   const genreCount=Object.values(groups[gg]).flatMap(x=>Object.values(x).flat()).length;
   gs.textContent=`${gg} (${genreCount}曲)`;
   gd.appendChild(gs);

   const holoArtists=groups[gg]["ホロライブ"]||{};
   const holoCount=Object.values(holoArtists).reduce((n,titles)=>n+titles.length,0);
   if(holoCount===0) return;
   const hololive=document.createElement('details');
   hololive.open=false;
   hololive.style.margin='8px 10px';
   const hs=document.createElement('summary');
   hs.textContent=`ホロライブ (${genreCount}曲)`;
   hololive.appendChild(hs);

   // ユニット曲
   const unitSongs=unitOrder
     .filter(unit=>holoArtists[unit])
     .map(unit=>[unit,holoArtists[unit]]);

   const ud=document.createElement('details');
   ud.open=false;
   ud.style.margin='8px 10px';
   const us=document.createElement('summary');
   const unitCount=unitSongs.reduce((n,[,titles])=>n+titles.length,0);
   us.textContent=`ユニット曲 (${unitCount}曲)`;
   ud.appendChild(us);

   unitSongs.forEach(([unit,titles])=>{
     ud.appendChild(makeUnitMemberDetails(unit,[...titles]));
   });
   hololive.appendChild(ud);

   // アーティスト
   const normalArtists=Object.keys(holoArtists).filter(name=>!unitMembers.has(name));
   const orderedArtists=artistOrder.filter(a=>normalArtists.includes(a));
   normalArtists.filter(a=>!orderedArtists.includes(a))
     .sort((a,b)=>a.localeCompare(b,'ja'))
     .forEach(a=>orderedArtists.push(a));

   orderedArtists.forEach(name=>{
     hololive.appendChild(makeArtistDetails(name,[...holoArtists[name]]));
   });

   gd.appendChild(hololive);
   list.appendChild(gd);
 });

 document.querySelector('#count').textContent=`表示：${filtered.length}曲 / 全${uniqueSongs.length}曲`;
 document.querySelector('#empty').style.display=filtered.length?'none':'block';
}
q.addEventListener('input',render);
g.addEventListener('change',render);
render();
</script>
</body>
</html>
