const uniqueSongs=[];
const seen=new Set();
for(const song of songs){
 const key=song.join("\t");
 if(!seen.has(key)){seen.add(key);uniqueSongs.push(song)}
}

const unitOrder=["hololive IDOL PROJECT","バカタレ共","メルティキッス","いろはにほへっと あやふぶみ","スバちょこるなたん","ホロ鳥","不知火建設","ししわた","ぺこまり","猫又おかゆ&姫森ルーナ","宝鐘マリン&Kobo Kanaeru"];

const honeyWorksArtistOrder=["HoneyWorks","瀬戸口優・榎本夏樹","榎本夏樹・綾瀬恋雪","望月蒼太・早坂あかり","芹沢春輝・合田美桜","芹沢春輝（幼少期）","濱中翠・成海聖奈","明智咲","榎本虎太郎・綾瀬恋雪・瀬戸口雛","榎本虎太郎・瀬戸口雛","柴崎健・高見沢アリサ","瀬戸口雛・高見沢アリサ","山本幸大・服部樹里","ちゅーたん","白波渚・涼海ひより","綾瀬恋雪・扇野りょう","瀬戸口流歌・望月あずき","LIP × LIP","柴崎健・柴崎愛蔵","勇次郎","南","成海聖奈","mona","成海聖奈・成海萌奈","天月","CHiCO with HoneyWorks","その他"];
const unitMembers=new Set(unitOrder);

const genres=[...new Set(uniqueSongs.map(x=>x[0]))].sort((a,b)=>a.localeCompare(b,'ja'));
const g=document.querySelector('#g'),q=document.querySelector('#q'),list=document.querySelector('#list');
genres.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;g.appendChild(o)});

function makeSongList(titles){
 const ul=document.createElement('ul');
 titles.sort((a,b)=>a.localeCompare(b,'ja')).forEach(t=>{
   const li=document.createElement('li');li.textContent=t;ul.appendChild(li);
 });
 return ul;
}
function makeArtistDetails(name,titles){
 const ad=document.createElement('details');ad.className='artist';ad.open=false;
 const as=document.createElement('summary');as.textContent=`${name} (${titles.length}曲)`;
 ad.appendChild(as);ad.appendChild(makeSongList(titles));return ad;
}
function makeUnitMemberDetails(name,titles){
 const ad=document.createElement('details');ad.className='unit-member';ad.open=false;
 const as=document.createElement('summary');as.textContent=`${name} (${titles.length}曲)`;
 ad.appendChild(as);ad.appendChild(makeSongList(titles));return ad;
}
function render(){
 const query=q.value.trim().toLowerCase(),genre=g.value;
 const filtered=uniqueSongs.filter(([gg,group,a,t])=>
   (!genre||gg===genre)&&(!query||`${gg} ${group} ${a} ${t}`.toLowerCase().includes(query)));
 const groups={};
 filtered.forEach(([gg,group,a,t])=>{
   groups[gg]??={};groups[gg][group]??={};groups[gg][group][a]??=[];groups[gg][group][a].push(t);
 });
 list.innerHTML='';
 Object.keys(groups).sort((a,b)=>{
   const order=["Vtuber","HoneyWorks","ボカロ","アニソン","J-POP","J-POPなど","その他"];
   return order.indexOf(a)-order.indexOf(b);
 }).forEach(gg=>{
   const gd=document.createElement('details');gd.open=false;
   const gs=document.createElement('summary');
   const genreCount=Object.values(groups[gg]).flatMap(x=>Object.values(x).flat()).length;
   gs.textContent=`${gg} (${genreCount}曲)`;gd.appendChild(gs);
   if(gg==="Vtuber"){
     const holoArtists=groups[gg]["ホロライブ"]||{};
     const holoCount=Object.values(holoArtists).reduce((n,titles)=>n+titles.length,0);
     if(holoCount===0) return;
     const hololive=document.createElement('details');hololive.open=false;hololive.style.margin='8px 10px';
     const hs=document.createElement('summary');hs.textContent=`ホロライブ (${genreCount}曲)`;hololive.appendChild(hs);
     const unitSongs=unitOrder.filter(unit=>holoArtists[unit]).map(unit=>[unit,holoArtists[unit]]);
     const ud=document.createElement('details');ud.open=false;ud.style.margin='8px 10px';
     const us=document.createElement('summary');const unitCount=unitSongs.reduce((n,[,titles])=>n+titles.length,0);
     us.textContent=`ユニット曲 (${unitCount}曲)`;ud.appendChild(us);
     unitSongs.forEach(([unit,titles])=>ud.appendChild(makeUnitMemberDetails(unit,[...titles])));
     hololive.appendChild(ud);
     const normalArtists=Object.keys(holoArtists).filter(name=>!unitMembers.has(name));
     const orderedArtists=artistOrder.filter(a=>normalArtists.includes(a));
     normalArtists.filter(a=>!orderedArtists.includes(a)).sort((a,b)=>a.localeCompare(b,'ja')).forEach(a=>orderedArtists.push(a));
     orderedArtists.forEach(name=>hololive.appendChild(makeArtistDetails(name,[...holoArtists[name]])));
     gd.appendChild(hololive);list.appendChild(gd);
   }else if(gg==="HoneyWorks"){
     const groupArtists=groups[gg]["HoneyWorks"]||{};const normalArtists=Object.keys(groupArtists);
     const orderedArtists=honeyWorksArtistOrder.filter(a=>normalArtists.includes(a));
     normalArtists.filter(a=>!orderedArtists.includes(a)).sort((a,b)=>a.localeCompare(b,'ja')).forEach(a=>orderedArtists.push(a));
     orderedArtists.forEach(name=>gd.appendChild(makeArtistDetails(name,[...groupArtists[name]])));
     list.appendChild(gd);
   }else if(gg==="ボカロ"){
     const groupArtists=groups[gg][""]||{};
     const normalArtists=Object.keys(groupArtists);
     const orderedArtists=artistOrder.filter(a=>normalArtists.includes(a));
     normalArtists.filter(a=>!orderedArtists.includes(a)).sort((a,b)=>a.localeCompare(b,'ja')).forEach(a=>orderedArtists.push(a));
     orderedArtists.forEach(name=>gd.appendChild(makeArtistDetails(name,[...groupArtists[name]])));
     list.appendChild(gd);
   }else if(gg==="アニソン"){
     const groupNames=Object.keys(groups[gg]);groupNames.sort((a,b)=>a.localeCompare(b,'ja'));
     groupNames.forEach(groupName=>{
       const groupArtists=groups[gg][groupName];
       const titles=Object.values(groupArtists).flat().sort((a,b)=>a.localeCompare(b,'ja'));
       const groupDetails=document.createElement('details');groupDetails.open=false;groupDetails.style.margin='8px 10px';
       const groupSummary=document.createElement('summary');groupSummary.textContent=`${groupName} (${titles.length}曲)`;
       groupDetails.appendChild(groupSummary);
       groupDetails.appendChild(makeSongList(titles));
       gd.appendChild(groupDetails);
     });list.appendChild(gd);
   }else{
     const groupNames=Object.keys(groups[gg]);groupNames.sort((a,b)=>a.localeCompare(b,'ja'));
     groupNames.forEach(groupName=>{
       const groupArtists=groups[gg][groupName];const groupCount=Object.values(groupArtists).reduce((n,titles)=>n+titles.length,0);
       const groupDetails=document.createElement('details');groupDetails.open=false;groupDetails.style.margin='8px 10px';
       const groupSummary=document.createElement('summary');groupSummary.textContent=`${groupName} (${groupCount}曲)`;
       groupDetails.appendChild(groupSummary);
       Object.keys(groupArtists).sort((a,b)=>a.localeCompare(b,'ja')).forEach(name=>{
         if(name==='') groupDetails.appendChild(makeSongList([...groupArtists[name]]));
         else groupDetails.appendChild(makeArtistDetails(name,[...groupArtists[name]]));
       });
       gd.appendChild(groupDetails);
     });list.appendChild(gd);
   }
 });
 document.querySelector('#count').textContent=`表示：${filtered.length}曲 / 全${uniqueSongs.length}曲`;
 document.querySelector('#empty').style.display=filtered.length?'none':'block';
}
q.addEventListener('input',render);g.addEventListener('change',render);render();
</script>
