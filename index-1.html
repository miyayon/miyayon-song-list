genres.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;g.appendChild(o)});
function render(){
 const query=q.value.trim().toLowerCase(), genre=g.value;
 const filtered=songs.filter(([gg,a,t])=>(!genre||gg===genre)&&(!query||`${gg} ${a} ${t}`.toLowerCase().includes(query)));
 const groups={};
 filtered.forEach(([gg,a,t])=>{groups[gg]??={};groups[gg][a]??=[];groups[gg][a].push(t)});
 list.innerHTML='';
 Object.keys(groups).sort((a,b)=>a.localeCompare(b,'ja')).forEach(gg=>{
  const d=document.createElement('details');d.open=true;
  const s=document.createElement('summary');s.textContent=`${gg} (${Object.values(groups[gg]).flat().length}曲)`;d.appendChild(s);
  Object.keys(groups[gg]).sort((a,b)=>a.localeCompare(b,'ja')).forEach(a=>{
   const box=document.createElement('div');box.className='artist';
   const b=document.createElement('b');b.textContent=a;box.appendChild(b);

   groups[gg][a].sort((x,y)=>x.localeCompare(y,'ja')).forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li)});
